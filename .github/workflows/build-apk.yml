name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Membuat APK
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil file repository
        uses: actions/checkout@v4

      - name: Menyiapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Menyiapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Memasang dependencies
        run: npm ci

      - name: Membuat proyek Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Menyinkronkan aplikasi
        run: npx cap sync android

      - name: Memberikan izin Gradle
        run: chmod +x android/gradlew

      - name: Membuat APK debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Mengunggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Asset-Management-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
